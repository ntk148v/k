[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-k"
version = "0.1.0"
description = "A minimal coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
k = "main:main"

[project.optional-dependencies]
dev = ["ruff>=0.11.0"]

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
line-length = 160
target-version = "py314"
src = ["main.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
